name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - readme
    paths:
      - .github/workflows/ci.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot-onecloud
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  PATCHES: 4077,5076
  PATCHES_DISABLED: 5082
  # 强制使用 Node 24 解决环境警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      env: ${{ steps.get.outputs.env }}
    steps:
      - id: get
        name: Get repositories information
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 使用内置变量获取时间，若获取不到则使用当前系统时间
          TIME="${{ github.event.run_started_at }}"
          [[ -z "$TIME" ]] && TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          # 2. 生成 TAG
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          
          # 3. 使用 gh api 获取 SHA 和 Tag，比 curl 更可靠
          SCRIPT_SHA="${{ github.sha }}"
          UBOOT_TAG=$(gh api repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE} --template '{{.tag_name}}')
          ARMBIAN_SHA=$(gh api repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} --template '{{.sha}}')

          # 4. 写入环境变量 (注意：这里去掉了多余的 sed 逻辑，直接写入更稳)
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "SCRIPT_SHA=$SCRIPT_SHA" >> $GITHUB_ENV
          echo "UBOOT_TAG=$UBOOT_TAG" >> $GITHUB_ENV
          echo "ARMBIAN_SHA=$ARMBIAN_SHA" >> $GITHUB_ENV
          
          # 5. 导出给后续 Job 使用
          # 这里我们需要手动构建一个临时文件来 base64 编码，确保不会因为换行符出错
          {
            echo "TIME=$TIME"
            echo "TAG=$TAG"
            echo "SCRIPT_SHA=$SCRIPT_SHA"
            echo "UBOOT_TAG=$UBOOT_TAG"
            echo "ARMBIAN_SHA=$ARMBIAN_SHA"
          } > .env_file
          echo "env=$(cat .env_file | base64 -w 0)" >> $GITHUB_OUTPUT

      - name: Show repositories information
        run: |
          C_RESET="\e[0m"
          C_GREEN="\e[32m"
          C_YELLOW="\e[33m"
          C_BLUE="\e[34m"
          C_MAGENTA="\e[35m"

          echo -e "TIME: ${C_GREEN}${TIME}${C_RESET}"
          echo -e "Script: ${C_BLUE}${SCRIPT_REPO}${C_RESET}@${C_MAGENTA}${SCRIPT_REF}${C_RESET}"
          echo -e "        ${C_YELLOW}${SCRIPT_SHA}${C_RESET}"
          echo -e "U-Boot: ${C_BLUE}${UBOOT_REPO}${C_RESET}@${C_MAGENTA}${UBOOT_TAG}${C_RESET}"
          echo -e "Armbian: ${C_BLUE}${ARMBIAN_REPO}${C_RESET}@${C_MAGENTA}${ARMBIAN_SHA}${C_RESET}"

          cat <<EOF >>$GITHUB_STEP_SUMMARY
          # Build Info - $(date -d "$TIME" +'%Y-%m-%d %H:%M:%S')
          ## Sources
          - Script: [${SCRIPT_REPO}@${SCRIPT_REF}](https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_REF}) (\`${SCRIPT_SHA}\`)
          - U-Boot: [${UBOOT_REPO}@${UBOOT_TAG}](https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_TAG})
          - Armbian: [${ARMBIAN_REPO}@${ARMBIAN_SHA}](https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_SHA})
          EOF

      - name: Generate release informations
        run: |
          echo "CI $(date -d "$TIME" +'%Y-%m-%d %H:%M:%S')" > Release.md
          echo "" >> Release.md
          echo "### Sources" >> Release.md
          echo "- Script: ${SCRIPT_REPO}@${SCRIPT_REF} (${SCRIPT_SHA})" >> Release.md
          echo "- U-Boot: ${UBOOT_REPO}@${UBOOT_TAG}" >> Release.md
          echo "- Armbian: ${ARMBIAN_REPO}@${ARMBIAN_SHA}" >> Release.md
          
          echo "NAME=$(head -n 1 Release.md)" >> $GITHUB_ENV
          tail -n +2 Release.md > Body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md

  build-debs:
    name: Build ${{ matrix.BRANCH }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: "Apply patches"
        if: ${{ env.PATCHES }}
        run: |
          for id in $(echo ${PATCHES} | tr ',' ' '); do
            curl -L "https://github.com/armbian/build/pull/${id}.patch" | patch -p1
          done

      - name: Build
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh kernel ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} EXPERT=yes USE_CCACHE=no
          sudo chown $(id -u):$(id -g) -R output/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: output/debs/*

  build:
    name: Build ${{ matrix.RELEASE }}-${{ matrix.BRANCH }}-${{ matrix.TYPE }}
    needs: [ prepare, build-debs ]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
        RELEASE: [noble, bookworm, trixie, sid]
        TYPE: [minimal, cli, desktop]
        include:
          - TYPE: desktop
            DESKTOP_ENVIRONMENT: xfce
            DESKTOP_ENVIRONMENT_CONFIG_NAME: config_base
    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/

      - name: Build
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh build \
            ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} RELEASE=${{ matrix.RELEASE }} \
            KERNEL_CONFIGURE=no BUILD_MINIMAL=${{ matrix.TYPE == 'minimal' && 'yes' || 'no' }} \
            BUILD_DESKTOP=${{ matrix.TYPE == 'desktop' && 'yes' || 'no' }} \
            DESKTOP_ENVIRONMENT=${{ matrix.DESKTOP_ENVIRONMENT }} \
            EXPERT=yes SKIP_EXTERNAL_TOOLCHAINS=yes USE_CCACHE=no COMPRESS_OUTPUTIMAGE=img
          sudo chown $(id -u):$(id -g) -R output/

      - name: Install Tools & Pack Burn Image
        run: |
          sudo apt update && sudo apt install -y img2simg
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/v0.3.1/AmlImg_v0.3.1_linux_amd64
          chmod +x ./AmlImg
          
          # 下载 U-Boot 并打包线刷包
          curl -L -o ./uboot.img https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}
          ./AmlImg unpack ./uboot.img burn/
          
          diskimg=$(ls output/images/*.img)
          loop=$(sudo losetup --find --show --partscan $diskimg)
          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop
          sudo chown $(id -u):$(id -g) -R burn/
          
          ./AmlImg pack ${diskimg%.img}.burn.img burn/

      - name: Hash and compress
        run: |
          for f in output/images/*.img; do
            sha256sum "$f" > "${f}.sha256"
            xz -9 --threads=0 "$f"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          append_body: true
          files: output/images/*
